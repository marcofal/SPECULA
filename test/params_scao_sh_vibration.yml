---
# Override of params_scao_sh_test.yml: adds a 47 Hz tip vibration,
# injected by a dedicated single-mode DM driven by a sinusoid.

main_override:
  total_time:        3.000                  # [s] long enough for many vibration cycles

vib_wave:
  class:             'WaveGenerator'
  wave_type:         'SIN'
  amp:               [150.0]                # [nm] vibration amplitude
  freq:              [47.0]                 # [Hz] vibration frequency
  outputs: ['output']

vib_dm:
  class:             'DM'
  simul_params_ref:  'main'
  type_str:          'zernike'
  idx_modes:         [0]                    # mode 0 = tip
  obsratio:          0.1
  height:            0
  inputs:
    in_command: 'vib_wave.output'
  outputs: ['out_layer']

prop_override:
  # 'inputs' is replaced as a whole: atmo_layer_list must be repeated
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop',
                  'dm.out_layer:-1',
                  'vib_dm.out_layer']

data_store_override:
  inputs:
    input_list: ['res_sr-psf.out_sr',
                 'res_modes-rec.out_modes',
                 'res_comm-control.out_comm']
